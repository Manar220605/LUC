services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: luc
      POSTGRES_USER: luc
      POSTGRES_PASSWORD: luc
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luc"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    entrypoint: ["/bin/sh", "/opt/keycloak/entrypoint.sh"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/luc
      KC_DB_USERNAME: luc
      KC_DB_PASSWORD: luc
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KEYCLOAK_LINKEDIN_CLIENT_ID: ${KEYCLOAK_LINKEDIN_CLIENT_ID}
      KEYCLOAK_LINKEDIN_CLIENT_SECRET: ${KEYCLOAK_LINKEDIN_CLIENT_SECRET}
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-mailhog}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-1025}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-noreply@luc.local}
      KEYCLOAK_SMTP_SSL: ${KEYCLOAK_SMTP_SSL:-false}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-false}
      KEYCLOAK_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH:-false}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER:-}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD:-}
    ports: ["8081:8080"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import-src/realm.json:ro
      - ./keycloak/entrypoint.sh:/opt/keycloak/entrypoint.sh:ro
      - ./keycloak/themes/luc:/opt/keycloak/themes/luc:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/luc
      SPRING_DATASOURCE_USERNAME: luc
      SPRING_DATASOURCE_PASSWORD: luc
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/luc
      KEYCLOAK_JWK_URI: http://host.docker.internal:8081/realms/luc/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://host.docker.internal:8081
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      SPRING_PROFILES_ACTIVE: dev
      LUC_FRONTEND_URL: http://localhost:3000
      LUC_MAIL_FROM: ${KEYCLOAK_SMTP_FROM:-LUC <noreply@luc.local>}
      MAIL_HOST: ${KEYCLOAK_SMTP_HOST:-mailhog}
      MAIL_PORT: ${KEYCLOAK_SMTP_PORT:-1025}
      MAIL_USERNAME: ${KEYCLOAK_SMTP_USER:-}
      MAIL_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD:-}
      MAIL_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-false}
      LUC_UPLOADS_DIR: /var/luc/uploads
    ports: ["8080:8080"]
    volumes:
      - backend_uploads:/var/luc/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      mailhog:
        condition: service_started

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_URL: http://backend:8080
      KEYCLOAK_ISSUER: http://localhost:8081/realms/luc
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_ID: luc-frontend
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports: ["3000:3000"]
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
