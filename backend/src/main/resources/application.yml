spring:
  application:
    name: luc-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.xml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_URI}

server:
  port: 8080
  servlet:
    context-path: /

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL}
    realm: luc
    client-id: luc-admin-client
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

luc:
  frontend-url: ${LUC_FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${LUC_MAIL_FROM:LUC <noreply@luc.local>}
  registration:
    password-setup-client-id: ${LUC_PASSWORD_SETUP_CLIENT_ID:luc-frontend}
    password-setup-link-lifespan-seconds: ${LUC_PASSWORD_SETUP_LIFESPAN_SECONDS:86400}
  uploads:
    dir: ${LUC_UPLOADS_DIR:uploads}
    max-avatar-bytes: ${LUC_UPLOADS_MAX_AVATAR_BYTES:2097152}
  embedder:
    url: ${LUC_EMBEDDER_URL:http://localhost:8088}
    connect-timeout-ms: ${LUC_EMBEDDER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${LUC_EMBEDDER_READ_TIMEOUT_MS:15000}

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
